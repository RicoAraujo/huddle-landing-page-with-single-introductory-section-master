<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
    rel="stylesheet">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/variables.css">
  <link rel="stylesheet" href="./css/responsive.css">

  <script src="https://kit.fontawesome.com/cec8158609.js" crossorigin="anonymous"></script>


  <title>Frontend Mentor | Huddle landing page with single introductory section</title>


</head>

<body>

  <header>
    <div class="logo-header">
      <img src="./huddle-landing-page-with-single-introductory-section-master/images/logo.svg" alt="logo"
        class="image-logo">
    </div>
  </header>

  <section class="conteudo">
    <div class="container">
      <div class="mockup">
        <img src="./huddle-landing-page-with-single-introductory-section-master/images/illustration-mockups.svg"
          alt="midia" class="tabela">
      </div>

      <div class="info">
        <h1 class="title">Build The Community Your Fans Will Love</h1>

        <p class="description">Huddle re-imagines the way we build communities. You have a voice, but so does your
          audience.
          Create connections with your users as you engage in genuine discussion.</p>

        <button class="register">Register</button>

      </div>

    </div>
  </section>



  <footer>
    <ul class="social-media">
      <li>
        <i class=" face fa-brands fa-facebook-f"></i>
      </li>
      <li>
        <i class=" twitter fa-brands fa-twitter"></i>
      </li>
      <li>
        <i class=" insta fa-brands fa-instagram"></i>
      </li>


    </ul>
  </footer>
</body>

</html>
